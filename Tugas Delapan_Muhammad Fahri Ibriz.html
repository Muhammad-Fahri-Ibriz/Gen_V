
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Ball Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Times New Roman', Times, serif;

    background: linear-gradient(
        135deg, #141e30, #243b55
    );
}

/* Judul */
h1 {
    color: white;
    font-size: 38px;
    animation: fadeIn 2s ease;
}

h2 {
    color: #38bdf8;
    margin-top: 10px;
    margin-bottom: 100px;
    animation: fadeIn 3s ease;
}

/* Area bola */
.area {
    width: 320px;
    height: 90px;
    position: relative;
    border-bottom: 3px solid white;
}

/* Bola menggelinding */
.ball {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    left: 0;

    background: #ff4757;

    /* Gerakan dan putaran */
    animation:
        roll 4s linear infinite alternate,
        colorChange 5s linear infinite;
}

/* Garis pada bola */
.ball::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 3px;
    background: white;
    top: 50%;
    transform: translateY(-50%);
}

.ball::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 100%;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

/* Gerakan menggelinding */
@keyframes roll {
    from {
        left: 0;
        transform: rotate(0deg);
    }

    to {
        left: 255px;
        transform: rotate(720deg);
    }
}

/* Perubahan warna */
@keyframes colorChange {
    0% {
        background: #ff4757;
    }

    25% {
        background: #ffa502;
    }

    50% {
        background: #2ed573;
    }

    75% {
        background: #1e90ff;
    }

    100% {
        background: #a55eea;
    }
}

/* Fade In */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Tulisan berjalan */
.marquee {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    margin-top: 60px;
}

.marquee span {
    display: inline-block;
    color: #facc15;
    font-size: 25px;
    font-weight: bold;
    padding-left: 100%;
    animation: berjalan 12s linear infinite;
}

@keyframes berjalan {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-100%);
    }
}

</style>
</head>

<body>

<h1>Selamat Belajar</h1>
<h2>CSS Transition & Animation</h2>

<div class="area">
    <div class="ball"></div>
</div>

<div class="marquee">
    <span>
        SELAMAT BELAJAR TRANSITION & ANIMATION
    </span>
</div>

</body>
</html>
